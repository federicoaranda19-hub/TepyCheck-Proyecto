{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Servis de PC{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" href="{% static 'myapp/css/styles.css' %}">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-md navbar-light navbar-dark static-top shadow-sm">
            <div class="container-fluid">

                <!-- Inicio -->
                <a class="navbar-brand fw-bold text-white" href="{% url 'myapp:index' %}">
                    Inicio
                </a>

                <!-- Botón del menú hamburguesa -->
                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarContenido"
                        aria-controls="navbarContenido"
                        aria-expanded="false"
                        aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Contenido del menú -->
                <div class="collapse navbar-collapse" id="navbarContenido">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link text-white btn btn-primary"
                               href="{% url 'myapp:clientes' %}">
                                Clientes
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white btn btn-primary"
                               href="{% url 'myapp:tecnicos' %}">
                                Técnicos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white btn btn-primary"
                               href="{% url 'myapp:equipos' %}">
                                Equipos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white btn btn-primary"
                               href="{% url 'myapp:reparaciones' %}">
                                Reparaciones
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white btn btn-primary"
                               href="#NADAAUN">
                                Iniciar
                            </a>
                        </li>

                    </ul>

                </div>

            </div>
        </nav>
    </header>

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2026 Servis PC. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
