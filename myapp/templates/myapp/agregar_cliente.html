{% extends 'base.html' %}

{% block title %}Agregar Cliente{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Agregar Nuevo Cliente</h1>

    <form method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Guardar Cliente</button>
            <a href="{% url 'myapp:clientes' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
