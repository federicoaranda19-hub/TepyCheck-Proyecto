{% extends 'base.html' %}

{% block title %}Nueva Reparación{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">Registrar Reparación</h2>
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 650px;">
        <form method="POST" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">Guardar Reparación</button>
                <a href="{% url 'myapp:reparaciones' %}" class="btn btn-secondary ms-2">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
