{% extends 'base.html' %}
{% load static %}

{% block title %}Home - Reparación de PC{% endblock %}

{% block content %}
<div class="container mt-4">

    <!-- Carrusel de Imágenes -->
    <div id="carouselExample" class="carousel slide mb-5" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3" aria-label="Slide 4"></button>
        </div>

        <div class="carousel-inner rounded">
            <div class="carousel-item active">
                <img src="{% static 'myapp/img/gabinete.jpg' %}" class="d-block w-100" alt="Gabinete" style="height: 450px; object-fit: cover;">
            </div>
            <div class="carousel-item">
                <img src="{% static 'myapp/img/herramientas.jpg' %}" class="d-block w-100" alt="Herramientas" style="height: 450px; object-fit: cover;">
            </div>
            <div class="carousel-item">
                <img src="{% static 'myapp/img/icono.png' %}" class="d-block w-100" alt="Icono" style="height: 450px; object-fit: cover;">
            </div>
            <div class="carousel-item">
                <img src="{% static 'myapp/img/reparacion.png' %}" class="d-block w-100" alt="Reparación" style="height: 450px; object-fit: cover;">
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>

    <!-- Mensaje de bienvenida -->
    <div class="text-center">
        <h1 class="mb-3">Bienvenido a Reparación de PC</h1>
        <p class="lead">{{ mensaje }}</p>
    </div>

</div>
{% endblock %}
